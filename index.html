<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050914"
    >

    <title>UDM — Un Día Más</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =====================================================
         INTRO
    ====================================================== -->

    <section
        id="intro"
        class="intro"
    >

        <!-- Fondo -->
        <div class="background">

            <div class="grid"></div>

            <div class="glow glow-blue"></div>

            <div class="glow glow-gold"></div>

            <div class="stars"></div>

        </div>


        <!-- Partículas -->
        <div class="particles">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- Contenedor principal -->
        <div class="intro-content">


            <!-- Círculo futurista -->

            <div
                id="loader"
                class="loader"
            >

                <!-- Anillos exteriores -->

                <div class="loader-ring ring-one"></div>

                <div class="loader-ring ring-two"></div>

                <div class="loader-ring ring-three"></div>


                <!-- Arco de carga -->

                <svg
                    class="loader-progress"
                    viewBox="0 0 300 300"
                >

                    <circle
                        class="progress-background"
                        cx="150"
                        cy="150"
                        r="135"
                    ></circle>

                    <circle
                        id="progressCircle"
                        class="progress-circle"
                        cx="150"
                        cy="150"
                        r="135"
                    ></circle>

                </svg>


                <!-- Puntos orbitales -->

                <div class="orbit-dot dot-one"></div>

                <div class="orbit-dot dot-two"></div>

                <div class="orbit-dot dot-three"></div>


                <!-- Logo -->

                <div class="logo-container">

                    <div
                        id="logo"
                        class="logo"
                    >
                        UDM
                    </div>

                    <div
                        id="subtitle"
                        class="subtitle"
                    >
                        UN DÍA MÁS
                    </div>

                </div>

            </div>


            <!-- Pequeña línea inferior -->

            <div
                id="loadingText"
                class="loading-text"
            >
                INICIANDO
            </div>


        </div>

    </section>



    <!-- =====================================================
         APLICACIÓN
    ====================================================== -->

    <main
        id="app"
        class="app"
    >

        <header class="app-header">

            <div class="app-brand">

                <div class="brand-logo">
                    UDM
                </div>

                <div>

                    <div class="brand-name">
                        UN DÍA MÁS
                    </div>

                    <div class="brand-description">
                        Un mensaje para cada día
                    </div>

                </div>

            </div>

        </header>


        <section class="app-content">

            <div class="app-card">

                <div class="card-label">
                    MENSAJE DE HOY
                </div>

                <h1>
                    Un nuevo día
                </h1>

                <p>
                    Detente. Escucha. Respira.
                    Sigue adelante.
                </p>

                <div class="app-circle">

                    <span>UDM</span>

                </div>

            </div>

        </section>


        <footer class="app-footer">

            UN DÍA MÁS · UDM

        </footer>

    </main>



    <script src="app.js"></script>

</body>

</html>
