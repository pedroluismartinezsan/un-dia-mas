<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050914"
    >

    <title>UDM - Un Día Más</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         PANTALLA DE INTRO
    ====================================================== -->

    <section id="intro">


        <!-- Fondo futurista -->

        <div class="intro-background">

            <div class="grid"></div>

            <div class="blue-glow"></div>

            <div class="gold-glow"></div>

            <div class="stars"></div>

        </div>


        <!-- Partículas -->

        <div class="particles">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- =================================================
             CENTRO DEL INTRO
        ================================================== -->

        <div class="intro-center">


            <!-- Cargador -->

            <div class="loader">


                <!-- Anillo exterior -->

                <div class="outer-ring"></div>


                <!-- Anillo tecnológico -->

                <div class="tech-ring">

                    <span class="tech-mark mark-1"></span>
                    <span class="tech-mark mark-2"></span>
                    <span class="tech-mark mark-3"></span>
                    <span class="tech-mark mark-4"></span>

                </div>


                <!-- Círculo de carga -->

                <div
                    id="loadingCircle"
                    class="loading-circle"
                ></div>


                <!-- Punto orbital -->

                <div class="orbit-point"></div>


                <!-- Centro -->

                <div class="loader-center">

                    <div class="udm">
                        UDM
                    </div>

                </div>


            </div>


            <!-- Texto de estado -->

            <div
                id="loadingText"
                class="loading-text"
            >
                INICIANDO
            </div>


        </div>


        <!-- =================================================
             NOMBRE DE LA APP
        ================================================== -->

        <div
            id="brandReveal"
            class="brand-reveal"
        >

            <div class="brand-title">
                UN DÍA MÁS
            </div>

            <div class="brand-line"></div>

        </div>


    </section>



    <!-- =====================================================
         INTERFAZ PRINCIPAL
    ====================================================== -->

    <main id="app">


        <!-- HEADER -->

        <header class="app-header">


            <div class="app-logo">
                UDM
            </div>


            <div class="app-brand">

                <div class="app-title">
                    UN DÍA MÁS
                </div>

                <div class="app-subtitle">
                    Un mensaje para cada día
                </div>

            </div>


        </header>



        <!-- CONTENIDO -->

        <section class="app-content">


            <div class="main-card">


                <div class="card-label">
                    MENSAJE DE HOY
                </div>


                <h1>
                    Un nuevo día
                </h1>


                <p>
                    Detente. Escucha. Respira.
                    Sigue adelante.
                </p>


                <div class="app-orbit">

                    <div class="app-orbit-ring"></div>

                    <span>
                        UDM
                    </span>

                </div>


            </div>


        </section>



        <!-- FOOTER -->

        <footer class="app-footer">

            UN DÍA MÁS

        </footer>


    </main>



    <!-- JAVASCRIPT -->

    <script src="app.js"></script>


</body>

</html>
