```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#07152f">

    <meta name="description"
          content="UN DÍA MÁS — Un momento para escuchar, reflexionar y seguir adelante.">

    <title>UN DÍA MÁS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- FONDO -->
    <div class="background">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="particles"></div>
    </div>


    <!-- APLICACIÓN -->
    <main class="app">

        <!-- HEADER -->
        <header class="header">

            <div class="brand">

                <div class="brand-icon">
                    <span>+</span>
                </div>

                <div class="brand-text">
                    <h1>UN DÍA MÁS</h1>
                    <p>Un momento para ti</p>
                </div>

            </div>

            <div class="date" id="currentDate">
                HOY
            </div>

        </header>


        <!-- CONTENIDO -->
        <section class="content">


            <!-- AUDIO DE HOY -->
            <article class="audio-card today-card">

                <div class="card-glow"></div>


                <!-- ETIQUETA -->
                <div class="today-label">

                    <span class="status-dot"></span>

                    AUDIO DE HOY

                </div>


                <!-- VISUALIZADOR -->
                <div class="visualizer" id="visualizer">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <!-- INFORMACIÓN -->
                <div class="audio-info">

                    <h2 id="todayTitle">
                        Un día más
                    </h2>

                    <p id="todayDescription">
                        Tómate un momento. Respira. Escucha.
                    </p>

                </div>


                <!-- REPRODUCTOR -->
                <div class="player">


                    <!-- BARRA DE PROGRESO -->
                    <div class="progress-container">

                        <div class="progress-bar"
                             id="progressBar">

                            <div class="progress"
                                 id="progress">
                            </div>

                        </div>


                        <div class="time">

                            <span id="currentTime">
                                0:00
                            </span>

                            <span id="duration">
                                0:00
                            </span>

                        </div>

                    </div>


                    <!-- CONTROLES -->
                    <div class="controls">


                        <button
                            class="control-button"
                            id="rewindButton"
                            aria-label="Retroceder 10 segundos">

                            ↶

                        </button>


                        <button
                            class="play-button"
                            id="playButton"
                            aria-label="Reproducir audio">

                            <span id="playIcon">
                                ▶
                            </span>

                        </button>


                        <button
                            class="control-button"
                            id="forwardButton"
                            aria-label="Avanzar 10 segundos">

                            ↷

                        </button>


                    </div>


                    <!-- AUDIO -->
                    <audio
                        id="audioPlayer"
                        preload="metadata">

                    </audio>


                    <!-- DESCARGA -->
                    <a
                        id="downloadButton"
                        class="download-button"
                        href="#"
                        download>

                        <span class="download-icon">
                            ↓
                        </span>

                        <span>
                            DESCARGAR AUDIO
                        </span>

                    </a>

                </div>

            </article>



            <!-- AUDIO DE AYER -->
            <article class="yesterday-card">

                <div class="yesterday-header">

                    <div>

                        <span class="small-label">
                            ANTERIOR
                        </span>

                        <h3>
                            Ayer
                        </h3>

                    </div>


                    <span
                        class="yesterday-date"
                        id="yesterdayDate">
                    </span>

                </div>


                <div class="yesterday-player">


                    <button
                        class="mini-play"
                        id="yesterdayPlay"
                        aria-label="Reproducir audio de ayer">

                        ▶

                    </button>


                    <div class="yesterday-info">

                        <strong id="yesterdayTitle">
                            Audio de ayer
                        </strong>


                        <div
                            class="mini-progress"
                            id="yesterdayProgressBar">

                            <div
                                id="yesterdayProgress">
                            </div>

                        </div>

                    </div>


                    <span
                        class="mini-duration"
                        id="yesterdayDuration">

                        0:00

                    </span>

                </div>


                <a
                    id="yesterdayDownload"
                    class="yesterday-download"
                    href="#"
                    download>

                    ↓ Descargar

                </a>

            </article>


        </section>


        <!-- PIE -->
        <footer class="footer">

            <div class="footer-line"></div>

            <p>
                UN DÍA MÁS
            </p>

            <span>
                Un momento. Una voz. Un día más.
            </span>

        </footer>


    </main>


    <!-- JAVASCRIPT -->
    <script src="app.js"></script>

</body>

</html>
```
