<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050914"
    >

    <title>UDM - Un Día Más</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ==============================
         INTRO UDM
    =============================== -->

    <section id="intro">

        <div class="background"></div>

        <div class="grid"></div>

        <div class="stars"></div>

        <div class="gold-glow"></div>

        <div class="blue-glow"></div>


        <!-- CONTENEDOR -->

        <div class="intro-center">


            <!-- CÍRCULO -->

            <div class="loader">


                <!-- Círculo de fondo -->

                <div class="circle circle-background"></div>


                <!-- Círculo que gira -->

                <div
                    id="loadingCircle"
                    class="circle circle-loading"
                ></div>


                <!-- Anillos -->

                <div class="ring ring-one"></div>

                <div class="ring ring-two"></div>


                <!-- PUNTO -->

                <div class="orbit-point"></div>


                <!-- LOGO -->

                <div class="logo-container">

                    <div id="logo">
                        UDM
                    </div>

                    <div id="subtitle">
                        UN DÍA MÁS
                    </div>

                </div>


            </div>


            <!-- TEXTO -->

            <div
                id="loadingText"
                class="loading-text"
            >
                INICIANDO
            </div>


        </div>

    </section>



    <!-- ==============================
         APP
    =============================== -->

    <main id="app">

        <header>

            <div class="brand">
                UDM
            </div>

            <div class="brand-name">
                UN DÍA MÁS
            </div>

        </header>


        <section class="content">

            <div class="card">

                <small>
                    MENSAJE DE HOY
                </small>

                <h1>
                    Un nuevo día
                </h1>

                <p>
                    Detente. Escucha. Respira. Sigue adelante.
                </p>

            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
