<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050914"
    >

    <title>UN DÍA MÁS</title>

    <link
        rel="stylesheet"
        href="style.css?v=2"
    >

</head>


<body>


    <!-- =====================================================
         INTRO
    ====================================================== -->

    <section id="intro">


        <div class="intro-background">

            <div class="grid"></div>

            <div class="blue-glow"></div>

            <div class="gold-glow"></div>

            <div class="stars"></div>

        </div>


        <div class="particles">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <div class="intro-center">


            <div class="loader">

                <div class="outer-ring"></div>

                <div class="tech-ring">

                    <span class="tech-mark mark-1"></span>
                    <span class="tech-mark mark-2"></span>
                    <span class="tech-mark mark-3"></span>
                    <span class="tech-mark mark-4"></span>

                </div>


                <div
                    id="loadingCircle"
                    class="loading-circle"
                ></div>


                <div class="orbit-point"></div>


                <div class="loader-center">

                    <div class="udm">
                        UDM
                    </div>

                </div>

            </div>


            <div
                id="loadingText"
                class="loading-text"
            >
                INICIANDO
            </div>


        </div>


        <div
            id="brandReveal"
            class="brand-reveal"
        >

            <div class="brand-title">
                UN DÍA MÁS
            </div>

            <div class="brand-line"></div>

        </div>


    </section>



    <!-- =====================================================
         APLICACIÓN
    ====================================================== -->

    <main id="app">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="app-header">


            <div class="app-logo">
                UDM
            </div>


            <div class="app-brand">

                <div class="app-title">
                    UN DÍA MÁS
                </div>

                <div class="app-subtitle">
                    Un mensaje para cada día
                </div>

            </div>


        </header>



        <!-- =================================================
             CONTENIDO
        ================================================== -->

        <section class="app-content">


            <div class="player-card">


                <!-- ETIQUETA -->

                <div class="player-label">
                    MENSAJE DE HOY
                </div>



                <!-- CÍRCULO DEL REPRODUCTOR -->

                <div
                    id="playerCircle"
                    class="player-circle"
                >


                    <div class="player-ring"></div>

                    <div class="player-ring ring-two"></div>


                    <div class="player-core">


                        <div class="audio-icon">

                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>

                        </div>


                        <button
                            id="playButton"
                            class="play-button"
                            aria-label="Reproducir"
                        >

                            <span
                                id="playIcon"
                                class="play-icon"
                            >
                                ▶
                            </span>

                        </button>


                    </div>


                </div>



                <!-- TÍTULO -->

                <h1 id="audioTitle">
                    Un nuevo día
                </h1>



                <!-- DESCRIPCIÓN -->

                <p id="audioDescription">

                    Detente un momento.
                    Escucha este mensaje
                    y continúa tu día.

                </p>



                <!-- BARRA DE PROGRESO -->

                <div class="progress-container">


                    <span id="currentTime">
                        00:00
                    </span>


                    <div
                        id="progressBar"
                        class="progress-bar"
                    >

                        <div
                            id="progressFill"
                            class="progress-fill"
                        ></div>

                        <div
                            id="progressDot"
                            class="progress-dot"
                        ></div>

                    </div>


                    <span id="duration">
                        01:48
                    </span>


                </div>



                <!-- CONTROLES -->

                <div class="player-controls">


                    <button
                        id="backButton"
                        class="control-button"
                        aria-label="Retroceder"
                    >
                        ↶
                    </button>


                    <button
                        id="mainPlayButton"
                        class="main-play-button"
                        aria-label="Reproducir"
                    >

                        <span id="mainPlayIcon">
                            ▶
                        </span>

                    </button>


                    <button
                        id="forwardButton"
                        class="control-button"
                        aria-label="Avanzar"
                    >
                        ↷
                    </button>


                </div>



                <!-- DESCARGAR -->

                <button
                    id="downloadButton"
                    class="download-button"
                >

                    <span class="download-icon">
                        ↓
                    </span>

                    DESCARGAR AUDIO

                </button>



                <!-- ANTERIORES -->

                <div class="previous-title">
                    MENSAJES ANTERIORES
                </div>


                <div class="previous-buttons">


                    <button
                        class="previous-button"
                    >

                        <span>
                            ◀
                        </span>

                        AYER

                    </button>


                    <button
                        class="previous-button"
                    >

                        ANTEAYER

                        <span>
                            ▶
                        </span>

                    </button>


                </div>


            </div>


        </section>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer class="app-footer">

            UN DÍA MÁS

        </footer>


    </main>



    <!-- AUDIO -->

    <audio
        id="audioPlayer"
        preload="metadata"
    ></audio>



    <!-- JAVASCRIPT -->

    <script src="app.js?v=2"></script>


</body>

</html>
