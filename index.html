<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050914"
    >

    <title>Un Día Más</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ==================================================
         PANTALLA DE INICIO
    =================================================== -->

    <section id="splash">


        <!-- Fondo -->

        <div class="splash-background">

            <div class="background-grid"></div>

            <div class="blue-light"></div>

            <div class="gold-light"></div>

            <div class="stars"></div>

        </div>


        <!-- Contenedor central -->

        <div class="splash-center">


            <!-- CÍRCULO DE CARGA -->

            <div class="loader">


                <!-- Anillo exterior -->

                <div class="loader-ring-outer"></div>


                <!-- Anillo interior -->

                <div class="loader-ring-inner"></div>


                <!-- Arco luminoso -->

                <div class="loader-spinner"></div>


                <!-- Punto luminoso -->

                <div class="loader-point"></div>


                <!-- Centro -->

                <div class="loader-center">

                    <div class="loader-symbol">
                        UDM
                    </div>

                </div>


            </div>


            <!-- Texto pequeño -->

            <div class="loading-label">

                INICIANDO

            </div>


        </div>


        <!-- ==================================================
             NOMBRE
        =================================================== -->

        <div
            id="brandReveal"
            class="brand-reveal"
        >

            <div class="brand-title">
                UN DÍA MÁS
            </div>

            <div class="brand-line"></div>

        </div>


    </section>



    <!-- ==================================================
         INTERFAZ PRINCIPAL
    =================================================== -->

    <main
        id="app"
        class="app"
    >


        <header class="app-header">


            <div class="app-logo">
                UDM
            </div>


            <div class="app-brand">

                <div class="app-title">
                    UN DÍA MÁS
                </div>

                <div class="app-subtitle">
                    Un mensaje para cada día
                </div>

            </div>


        </header>



        <section class="app-main">


            <div class="welcome-card">


                <div class="card-label">
                    MENSAJE DE HOY
                </div>


                <h1>
                    Un nuevo día
                </h1>


                <p>
                    Detente. Escucha. Respira.
                    Sigue adelante.
                </p>


                <div class="card-orbit">

                    <div class="card-orbit-ring"></div>

                    <span>
                        UDM
                    </span>

                </div>


            </div>


        </section>



        <footer class="app-footer">

            UN DÍA MÁS

        </footer>


    </main>



    <script src="app.js"></script>

</body>

</html>
