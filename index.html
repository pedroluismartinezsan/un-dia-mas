<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#061126"
    >

    <title>UN DÍA MÁS</title>

    <link
        rel="stylesheet"
        href="style.css?v=5"
    >

</head>


<body>


    <!-- =====================================================
         INTRO
    ====================================================== -->

    <section id="intro">


        <div class="intro-background">

            <div class="grid"></div>

            <div class="blue-glow"></div>

            <div class="gold-glow"></div>

            <div class="stars"></div>

        </div>


        <div class="particles">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <div class="intro-center">


            <div class="loader">

                <div class="outer-ring"></div>

                <div class="tech-ring">

                    <span class="tech-mark mark-1"></span>
                    <span class="tech-mark mark-2"></span>
                    <span class="tech-mark mark-3"></span>
                    <span class="tech-mark mark-4"></span>

                </div>


                <div
                    id="loadingCircle"
                    class="loading-circle"
                ></div>


                <div class="orbit-point"></div>


                <div class="loader-center">

                    <div class="udm">
                        UDM
                    </div>

                </div>

            </div>


            <div
                id="loadingText"
                class="loading-text"
            >
                INICIANDO
            </div>


        </div>


        <div
            id="brandReveal"
            class="brand-reveal"
        >

            <div class="brand-title">
                UN DÍA MÁS
            </div>

            <div class="brand-line"></div>

        </div>


    </section>



    <!-- =====================================================
         APLICACIÓN
    ====================================================== -->

    <main id="app">


        <!-- HEADER -->

        <header class="app-header">


            <div class="header-logo">

                <span>UDM</span>

            </div>


            <div class="header-brand">

                <div class="header-title">
                    UN DÍA MÁS
                </div>

                <div class="header-subtitle">
                    Un mensaje para cada día
                </div>

            </div>


            <div class="header-status">

                <span class="status-dot"></span>

                <span>
                    EN LÍNEA
                </span>

            </div>


        </header>



        <!-- CONTENIDO -->

        <section class="app-content">


            <!-- FECHA -->

            <div class="today-label">

                <span class="today-line"></span>

                <span>
                    MENSAJE DE HOY
                </span>

                <span class="today-line"></span>

            </div>


            <div class="today-date">
                24 SEPTIEMBRE 2026
            </div>



            <!-- =================================================
                 REPRODUCTOR FUTURISTA
            ================================================== -->

            <section class="audio-player">


                <!-- HALO DE FONDO -->

                <div class="player-halo"></div>


                <!-- VISUALIZADOR -->

                <div class="audio-visualizer">


                    <div class="visual-ring ring-1"></div>

                    <div class="visual-ring ring-2"></div>

                    <div class="visual-ring ring-3"></div>


                    <div class="wave wave-1"></div>
                    <div class="wave wave-2"></div>
                    <div class="wave wave-3"></div>


                    <div class="audio-bars">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <!-- BOTÓN CENTRAL -->

                    <button
                        id="playButton"
                        class="main-play"
                        aria-label="Reproducir mensaje"
                    >

                        <span
                            id="playIcon"
                            class="play-symbol"
                        >
                            ▶
                        </span>

                    </button>


                </div>



                <!-- INFORMACIÓN -->

                <div class="audio-info">


                    <div class="audio-type">
                        MENSAJE DEL DÍA
                    </div>


                    <h1 id="audioTitle">
                        Un nuevo día
                    </h1>


                    <p id="audioDescription">

                        Detente un momento.
                        Escucha este mensaje
                        y continúa tu día.

                    </p>


                </div>



                <!-- TIEMPOS -->

                <div class="time-row">

                    <span id="currentTime">
                        00:00
                    </span>

                    <span id="duration">
                        01:42
                    </span>

                </div>



                <!-- PROGRESO -->

                <div
                    id="progressBar"
                    class="progress-track"
                >

                    <div
                        id="progressFill"
                        class="progress-fill"
                    ></div>

                    <div
                        id="progressDot"
                        class="progress-dot"
                    ></div>

                </div>



                <!-- CONTROLES -->

                <div class="player-controls">


                    <button
                        id="backButton"
                        class="round-control"
                        aria-label="Retroceder 15 segundos"
                    >

                        <span class="control-icon">
                            ↶
                        </span>

                        <small>
                            15
                        </small>

                    </button>


                    <button
                        id="mainPlayButton"
                        class="center-control"
                        aria-label="Reproducir"
                    >

                        <span id="mainPlayIcon">
                            ▶
                        </span>

                    </button>


                    <button
                        id="forwardButton"
                        class="round-control"
                        aria-label="Avanzar 15 segundos"
                    >

                        <span class="control-icon">
                            ↷
                        </span>

                        <small>
                            15
                        </small>

                    </button>


                </div>



                <!-- DESCARGA -->

                <button
                    id="downloadButton"
                    class="download-button"
                >

                    <span class="download-symbol">
                        ↓
                    </span>

                    <span>
                        DESCARGAR AUDIO
                    </span>

                </button>


            </section>



            <!-- =================================================
                 MENSAJES ANTERIORES
            ================================================== -->

            <section class="previous-section">


                <div class="section-heading">

                    <span></span>

                    MENSAJES ANTERIORES

                    <span></span>

                </div>


                <div class="previous-grid">


                    <button
                        class="previous-card"
                    >

                        <div class="previous-icon">
                            ◀
                        </div>

                        <div class="previous-content">

                            <small>
                                AYER
                            </small>

                            <strong>
                                23 SEPTIEMBRE
                            </strong>

                        </div>

                        <div class="previous-arrow">
                            →
                        </div>

                    </button>



                    <button
                        class="previous-card"
                    >

                        <div class="previous-icon">
                            ◀
                        </div>

                        <div class="previous-content">

                            <small>
                                ANTEAYER
                            </small>

                            <strong>
                                22 SEPTIEMBRE
                            </strong>

                        </div>

                        <div class="previous-arrow">
                            →
                        </div>

                    </button>


                </div>


            </section>


        </section>



        <!-- FOOTER -->

        <footer class="app-footer">

            <span class="footer-line"></span>

            UN DÍA MÁS

            <span class="footer-line"></span>

        </footer>


    </main>



    <!-- AUDIO -->

    <audio
        id="audioPlayer"
        preload="metadata"
    ></audio>



    <!-- JAVASCRIPT -->

    <script src="app.js?v=5"></script>


</body>

</html>
```
