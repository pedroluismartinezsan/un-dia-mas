<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UN DÍA MÁS — Panel de Publicación</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(212,175,55,.10), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(0,120,255,.12), transparent 35%),
        #061329;
    color:#fff;
    overflow-x:hidden;
}

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.glow{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.25;
}

.glow-1{
    background:#0d6efd;
    top:-150px;
    left:-100px;
}

.glow-2{
    background:#d4af37;
    bottom:-150px;
    right:-100px;
}

.container{
    width:min(720px,92%);
    margin:auto;
    padding:35px 0 50px;
    position:relative;
    z-index:2;
}

header{
    text-align:center;
    margin-bottom:30px;
}

.logo{
    font-size:30px;
    font-weight:800;
    letter-spacing:5px;
    color:#d4af37;
    text-shadow:0 0 20px rgba(212,175,55,.35);
}

.subtitle{
    margin-top:8px;
    color:#9fb0c8;
    font-size:14px;
    letter-spacing:2px;
}

.date{
    margin-top:18px;
    font-size:13px;
    color:#7f91aa;
}

.card{
    background:rgba(10,28,56,.78);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:
        0 20px 60px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.04);
    backdrop-filter:blur(18px);
}

.card-title{
    color:#d4af37;
    font-size:13px;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:18px;
}

.upload-area{
    border:2px dashed rgba(212,175,55,.35);
    border-radius:20px;
    padding:35px 20px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
    background:rgba(255,255,255,.02);
}

.upload-area:hover{
    border-color:#d4af37;
    background:rgba(212,175,55,.05);
    transform:translateY(-2px);
}

.upload-icon{
    font-size:45px;
    margin-bottom:12px;
}

.upload-title{
    font-size:18px;
    font-weight:bold;
}

.upload-text{
    color:#8798b1;
    font-size:13px;
    margin-top:8px;
}

#fileInput{
    display:none;
}

.file-info{
    display:none;
    margin-top:18px;
    padding:14px;
    border-radius:14px;
    background:rgba(0,0,0,.2);
    border:1px solid rgba(255,255,255,.06);
}

.file-name{
    font-weight:bold;
    word-break:break-word;
}

.file-size{
    color:#8798b1;
    font-size:12px;
    margin-top:5px;
}

label{
    display:block;
    color:#b9c6d8;
    font-size:13px;
    margin-bottom:8px;
}

input[type="text"]{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.1);
    outline:none;
    background:rgba(0,0,0,.25);
    color:#fff;
    font-size:16px;
    transition:.3s;
}

input[type="text"]:focus{
    border-color:#d4af37;
    box-shadow:0 0 0 3px rgba(212,175,55,.08);
}

.preview{
    display:none;
    margin-top:20px;
}

.preview-title{
    font-size:12px;
    color:#8fa0b8;
    letter-spacing:1px;
    margin-bottom:10px;
}

audio{
    width:100%;
}

.publish-button{
    width:100%;
    border:none;
    border-radius:16px;
    padding:18px;
    background:linear-gradient(135deg,#d4af37,#f0d477);
    color:#061329;
    font-weight:900;
    font-size:16px;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 10px 35px rgba(212,175,55,.25);
    transition:.25s;
}

.publish-button:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 45px rgba(212,175,55,.35);
}

.publish-button:active{
    transform:scale(.98);
}

.publish-button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
}

.status{
    display:none;
    margin-top:18px;
    padding:15px;
    border-radius:14px;
    text-align:center;
    font-size:14px;
}

.status.loading{
    display:block;
    background:rgba(0,120,255,.1);
    border:1px solid rgba(0,120,255,.25);
    color:#8ec5ff;
}

.status.success{
    display:block;
    background:rgba(40,200,120,.1);
    border:1px solid rgba(40,200,120,.25);
    color:#72e5aa;
}

.status.error{
    display:block;
    background:rgba(255,70,70,.1);
    border:1px solid rgba(255,70,70,.25);
    color:#ff9292;
}

.info{
    color:#7f91aa;
    font-size:12px;
    line-height:1.6;
    text-align:center;
}

footer{
    text-align:center;
    margin-top:25px;
    color:#53657e;
    font-size:11px;
    letter-spacing:1px;
}

/* IFRAME OCULTO PARA ENVIAR EL FORMULARIO */
#uploadFrame{
    display:none;
}

@media(max-width:600px){

    .container{
        padding-top:25px;
    }

    .logo{
        font-size:24px;
        letter-spacing:4px;
    }

    .card{
        padding:20px;
        border-radius:20px;
    }

    .upload-area{
        padding:30px 15px;
    }

}

</style>
</head>

<body>

<div class="background">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
</div>

<div class="container">

<header>

    <div class="logo">
        UN DÍA MÁS
    </div>

    <div class="subtitle">
        PANEL DE PUBLICACIÓN
    </div>

    <div class="date" id="currentDate">
        Cargando fecha...
    </div>

</header>


<!-- ARCHIVO -->
<div class="card">

    <div class="card-title">
        01 · SELECCIONAR MP3
    </div>

    <label
        for="fileInput"
        class="upload-area"
        id="uploadArea"
    >

        <div class="upload-icon">
            🎧
        </div>

        <div class="upload-title">
            Seleccionar audio
        </div>

        <div class="upload-text">
            Toca aquí para seleccionar un archivo MP3
        </div>

    </label>

    <input
        type="file"
        id="fileInput"
        accept="audio/mpeg,.mp3"
    >

    <div class="file-info" id="fileInfo">

        <div class="file-name" id="fileName">
            —
        </div>

        <div class="file-size" id="fileSize">
            —
        </div>

    </div>

</div>


<!-- TITULO -->
<div class="card">

    <div class="card-title">
        02 · TÍTULO
    </div>

    <label for="titleInput">
        Escribe el título del mensaje
    </label>

    <input
        type="text"
        id="titleInput"
        placeholder="Ejemplo: No estás solo"
        maxlength="120"
    >

</div>


<!-- PREVISUALIZACION -->
<div class="card">

    <div class="card-title">
        03 · ESCUCHAR
    </div>

    <div
        class="preview"
        id="preview"
    >

        <div class="preview-title">
            PREVISUALIZACIÓN DEL AUDIO
        </div>

        <audio
            id="audioPreview"
            controls
            preload="metadata"
        ></audio>

    </div>

    <div
        class="info"
        id="previewMessage"
    >
        Selecciona un MP3 para escucharlo antes de publicar.
    </div>

</div>


<!-- PUBLICAR -->
<div class="card">

    <div class="card-title">
        04 · PUBLICAR
    </div>

    <button
        class="publish-button"
        id="publishButton"
        disabled
    >
        ✦ PUBLICAR AUDIO ✦
    </button>

    <div
        class="status"
        id="status"
    ></div>

</div>


<footer>
    UN DÍA MÁS · Un momento para ti
</footer>

</div>


<!--
    FORMULARIO REAL.
    Se utiliza un iframe oculto para evitar problemas
    de CORS entre GitHub Pages y Google Apps Script.
-->
<iframe
    name="uploadFrame"
    id="uploadFrame"
></iframe>

<form
    id="uploadForm"
    method="POST"
    target="uploadFrame"
    style="display:none;"
>

    <input
        type="hidden"
        name="titulo"
        id="formTitulo"
    >

    <input
        type="hidden"
        name="audio"
        id="formAudio"
    >

</form>


<script>

/*******************************************************
 * CONFIGURACIÓN
 *******************************************************/

const BACKEND_URL =
"https://script.google.com/macros/s/AKfycbzTWEH36OvvvpLfSsa8HtUlvZWKCQ-cBEOrhyyCtH1My5xceHpNo_sVhotDDm8snukA/exec";


/*******************************************************
 * ELEMENTOS
 *******************************************************/

const fileInput =
    document.getElementById("fileInput");

const uploadArea =
    document.getElementById("uploadArea");

const fileInfo =
    document.getElementById("fileInfo");

const fileName =
    document.getElementById("fileName");

const fileSize =
    document.getElementById("fileSize");

const titleInput =
    document.getElementById("titleInput");

const audioPreview =
    document.getElementById("audioPreview");

const preview =
    document.getElementById("preview");

const previewMessage =
    document.getElementById("previewMessage");

const publishButton =
    document.getElementById("publishButton");

const statusBox =
    document.getElementById("status");

const uploadForm =
    document.getElementById("uploadForm");

const formTitulo =
    document.getElementById("formTitulo");

const formAudio =
    document.getElementById("formAudio");

const currentDate =
    document.getElementById("currentDate");


let selectedFile = null;
let previewUrl = null;


/*******************************************************
 * FECHA
 *******************************************************/

function mostrarFecha(){

    const fecha = new Date();

    currentDate.textContent =
        fecha.toLocaleDateString(
            "es-CO",
            {
                weekday:"long",
                year:"numeric",
                month:"long",
                day:"numeric"
            }
        );

}

mostrarFecha();


/*******************************************************
 * SELECCIONAR MP3
 *******************************************************/

fileInput.addEventListener(
    "change",
    function(){

        const file = this.files[0];

        if(!file){
            return;
        }

        if(
            file.type !== "audio/mpeg" &&
            !file.name.toLowerCase().endsWith(".mp3")
        ){

            mostrarEstado(
                "error",
                "Por favor selecciona un archivo MP3."
            );

            this.value = "";
            return;
        }

        selectedFile = file;

        fileName.textContent =
            file.name;

        fileSize.textContent =
            formatearTamano(file.size);

        fileInfo.style.display =
            "block";


        if(previewUrl){
            URL.revokeObjectURL(previewUrl);
        }

        previewUrl =
            URL.createObjectURL(file);

        audioPreview.src =
            previewUrl;

        preview.style.display =
            "block";

        previewMessage.style.display =
            "none";

        comprobarFormulario();

        ocultarEstado();

    }
);


/*******************************************************
 * TITULO
 *******************************************************/

titleInput.addEventListener(
    "input",
    function(){

        comprobarFormulario();

        ocultarEstado();

    }
);


/*******************************************************
 * COMPROBAR FORMULARIO
 *******************************************************/

function comprobarFormulario(){

    const tieneAudio =
        selectedFile !== null;

    const tieneTitulo =
        titleInput.value.trim().length > 0;

    publishButton.disabled =
        !(tieneAudio && tieneTitulo);

}


/*******************************************************
 * PUBLICAR
 *******************************************************/

publishButton.addEventListener(
    "click",
    async function(){

        if(!selectedFile){

            mostrarEstado(
                "error",
                "Selecciona primero un archivo MP3."
            );

            return;
        }


        const titulo =
            titleInput.value.trim();


        if(!titulo){

            mostrarEstado(
                "error",
                "Escribe el título del audio."
            );

            titleInput.focus();

            return;
        }


        publishButton.disabled = true;

        publishButton.textContent =
            "⏳ PREPARANDO AUDIO...";


        mostrarEstado(
            "loading",
            "Preparando el audio para publicar..."
        );


        try{

            /*
             * Convertimos el MP3 a Base64.
             * El backend de Apps Script lo recibe
             * mediante POST.
             */

            const base64 =
                await archivoABase64(selectedFile);


            formTitulo.value =
                titulo;

            formAudio.value =
                base64;


            mostrarEstado(
                "loading",
                "🚀 Publicando audio...<br><br>Esto puede tardar unos segundos."
            );


            /*
             * Enviamos el formulario directamente
             * a Google Apps Script.
             */

            uploadForm.action =
                BACKEND_URL;

            uploadForm.submit();


            /*
             * Como el envío se hace mediante iframe,
             * no dependemos de CORS para recibir
             * la respuesta.
             */

            setTimeout(
                function(){

                    mostrarEstado(
                        "success",
                        "✓ El audio fue enviado para publicación.<br><br>" +
                        "Espera unos segundos y luego verifica la aplicación."
                    );

                    publishButton.textContent =
                        "✓ AUDIO ENVIADO";

                },
                3500
            );


        }catch(error){

            console.error(error);

            mostrarEstado(
                "error",
                "No fue posible preparar el audio."
            );

            publishButton.disabled =
                false;

            publishButton.textContent =
                "✦ PUBLICAR AUDIO ✦";

        }

    }
);


/*******************************************************
 * ARCHIVO → BASE64
 *******************************************************/

function archivoABase64(file){

    return new Promise(
        function(resolve,reject){

            const reader =
                new FileReader();

            reader.onload =
                function(){

                    const resultado =
                        reader.result;

                    /*
                     * Eliminamos:
                     *
                     * data:audio/mpeg;base64,
                     *
                     * y dejamos solamente
                     * la información Base64.
                     */

                    const base64 =
                        resultado.split(",")[1];

                    resolve(base64);

                };

            reader.onerror =
                function(){

                    reject(
                        new Error(
                            "No se pudo leer el archivo."
                        )
                    );

                };

            reader.readAsDataURL(file);

        }
    );

}


/*******************************************************
 * TAMAÑO DEL ARCHIVO
 *******************************************************/

function formatearTamano(bytes){

    if(bytes === 0){
        return "0 Bytes";
    }

    const unidades =
        [
            "Bytes",
            "KB",
            "MB",
            "GB"
        ];

    const indice =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        parseFloat(
            (
                bytes /
                Math.pow(1024,indice)
            ).toFixed(2)
        )
        +
        " "
        +
        unidades[indice]
    );

}


/*******************************************************
 * ESTADOS
 *******************************************************/

function mostrarEstado(tipo,mensaje){

    statusBox.className =
        "status " + tipo;

    statusBox.innerHTML =
        mensaje;

    statusBox.style.display =
        "block";

}


function ocultarEstado(){

    statusBox.style.display =
        "none";

}


/*******************************************************
 * LIMPIAR URL AL SALIR
 *******************************************************/

window.addEventListener(
    "beforeunload",
    function(){

        if(previewUrl){

            URL.revokeObjectURL(
                previewUrl
            );

        }

    }
);

</script>

</body>
</html>
