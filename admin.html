<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#07152f">

  <title>UN DÍA MÁS — Panel de publicación</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #07152f;
      --navy-light: #0d2144;
      --gold: #d8b45a;
      --gold-light: #f4d98b;
      --white: #ffffff;
      --text: #eaf0ff;
      --muted: #91a0bd;
      --glass: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.12);
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(216, 180, 90, 0.12),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(30, 100, 200, 0.16),
          transparent 30%
        ),
        linear-gradient(145deg, #040c1c, var(--navy), #020817);

      padding: 25px 15px;
      overflow-x: hidden;
    }

    /* Fondo */

    .background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.25;
    }

    .glow-1 {
      width: 300px;
      height: 300px;
      background: #174a9c;
      top: -100px;
      left: -100px;
    }

    .glow-2 {
      width: 260px;
      height: 260px;
      background: #a57b18;
      right: -80px;
      bottom: -80px;
    }

    .app {
      width: min(720px, 100%);
      margin: auto;
    }

    /* Encabezado */

    header {
      text-align: center;
      padding: 15px 10px 25px;
    }

    .brand {
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 5px;
      color: var(--gold-light);
      text-shadow:
        0 0 12px rgba(216, 180, 90, 0.35),
        0 0 35px rgba(216, 180, 90, 0.12);
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .date {
      margin-top: 15px;
      font-size: 0.9rem;
      color: var(--gold);
    }

    /* Tarjeta */

    .card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--gold-light);
      margin-bottom: 22px;
    }

    .section-title::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 14px var(--gold);
    }

    /* Selector */

    .upload-area {
      border: 1.5px dashed rgba(216, 180, 90, 0.45);
      border-radius: 22px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.25s ease;
      background: rgba(255, 255, 255, 0.025);
    }

    .upload-area:hover {
      border-color: var(--gold);
      background: rgba(216, 180, 90, 0.06);
      transform: translateY(-2px);
    }

    .upload-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .upload-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .upload-text {
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    #audioFile {
      display: none;
    }

    /* Archivo seleccionado */

    .file-info {
      display: none;
      margin-top: 18px;
      padding: 15px;
      border-radius: 16px;
      background: rgba(216, 180, 90, 0.08);
      border: 1px solid rgba(216, 180, 90, 0.2);
    }

    .file-info.show {
      display: block;
    }

    .file-name {
      font-weight: 700;
      color: var(--gold-light);
      word-break: break-word;
    }

    .file-size {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* Campo título */

    .field {
      margin-top: 25px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: var(--gold-light);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 17px;
      border: 1px solid var(--border);
      border-radius: 15px;
      outline: none;
      color: var(--white);
      background: rgba(0, 0, 0, 0.22);
      font-size: 1rem;
      transition: 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(216, 180, 90, 0.1);
    }

    /* Reproductor */

    .preview {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .preview.show {
      display: block;
    }

    .preview-title {
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    audio {
      width: 100%;
      height: 48px;
    }

    /* Botón */

    .publish-button {
      width: 100%;
      margin-top: 28px;
      padding: 17px;
      border: none;
      border-radius: 17px;
      cursor: pointer;

      color: #17120a;
      background: linear-gradient(
        135deg,
        var(--gold-light),
        var(--gold)
      );

      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 1.5px;

      box-shadow:
        0 10px 35px rgba(216, 180, 90, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);

      transition: 0.2s ease;
    }

    .publish-button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 15px 45px rgba(216, 180, 90, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    .publish-button:active {
      transform: scale(0.98);
    }

    .publish-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
      box-shadow: none;
    }

    /* Estado */

    .status {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      font-size: 0.85rem;
    }

    .status.show {
      display: block;
    }

    .status.success {
      color: #c9ffd9;
      background: rgba(40, 180, 90, 0.1);
      border: 1px solid rgba(40, 180, 90, 0.2);
    }

    .status.error {
      color: #ffd0d0;
      background: rgba(220, 60, 60, 0.1);
      border: 1px solid rgba(220, 60, 60, 0.2);
    }

    footer {
      text-align: center;
      padding: 25px 10px 10px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 1px;
    }

    /* Móvil */

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 20px;
        border-radius: 22px;
      }

      .brand {
        letter-spacing: 3px;
      }

      .upload-area {
        padding: 28px 15px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <div class="app">

    <header>
      <div class="brand">UN DÍA MÁS</div>

      <div class="subtitle">
        Panel de publicación
      </div>

      <div class="date" id="currentDate">
        Cargando fecha...
      </div>
    </header>

    <main class="card">

      <div class="section-title">
        PUBLICAR AUDIO DE HOY
      </div>

      <!-- SELECCIONAR MP3 -->

      <label for="audioFile" class="upload-area">

        <div class="upload-icon">
          🎧
        </div>

        <div class="upload-title">
          Seleccionar MP3
        </div>

        <div class="upload-text">
          Toca aquí para elegir el audio
        </div>

      </label>

      <input
        type="file"
        id="audioFile"
        accept="audio/mpeg,audio/mp3,.mp3"
      >

      <!-- INFORMACIÓN DEL ARCHIVO -->

      <div class="file-info" id="fileInfo">

        <div class="file-name" id="fileName">
          -
        </div>

        <div class="file-size" id="fileSize">
          -
        </div>

      </div>

      <!-- TÍTULO -->

      <div class="field">

        <label for="audioTitle">
          Título
        </label>

        <input
          type="text"
          id="audioTitle"
          maxlength="100"
          placeholder="Escribe el título del mensaje"
        >

      </div>

      <!-- PREVISUALIZACIÓN -->

      <div class="preview" id="preview">

        <div class="preview-title">
          Vista previa
        </div>

        <audio
          id="audioPreview"
          controls
          preload="metadata"
        ></audio>

      </div>

      <!-- PUBLICAR -->

      <button
        class="publish-button"
        id="publishButton"
        disabled
      >
        ✦ PUBLICAR AUDIO ✦
      </button>

      <div
        class="status"
        id="status"
      ></div>

    </main>

    <footer>
      UN DÍA MÁS · Panel de publicación
    </footer>

  </div>

  <script>

    const audioFile = document.getElementById("audioFile");
    const audioTitle = document.getElementById("audioTitle");
    const audioPreview = document.getElementById("audioPreview");
    const fileInfo = document.getElementById("fileInfo");
    const fileName = document.getElementById("fileName");
    const fileSize = document.getElementById("fileSize");
    const preview = document.getElementById("preview");
    const publishButton = document.getElementById("publishButton");
    const status = document.getElementById("status");
    const currentDate = document.getElementById("currentDate");

    let selectedFile = null;
    let previewUrl = null;

    /* Fecha actual */

    function showCurrentDate() {

      const now = new Date();

      const formatted = new Intl.DateTimeFormat(
        "es-CO",
        {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      ).format(now);

      currentDate.textContent =
        formatted.charAt(0).toUpperCase() +
        formatted.slice(1);
    }

    showCurrentDate();

    /* Seleccionar archivo */

    audioFile.addEventListener("change", () => {

      const file = audioFile.files[0];

      if (!file) {
        return;
      }

      if (!file.name.toLowerCase().endsWith(".mp3")) {

        showStatus(
          "Selecciona un archivo MP3.",
          "error"
        );

        audioFile.value = "";
        return;
      }

      selectedFile = file;

      fileName.textContent = file.name;

      fileSize.textContent =
        formatFileSize(file.size);

      fileInfo.classList.add("show");

      if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
      }

      previewUrl = URL.createObjectURL(file);

      audioPreview.src = previewUrl;

      preview.classList.add("show");

      updatePublishButton();

      hideStatus();
    });

    /* Título */

    audioTitle.addEventListener(
      "input",
      updatePublishButton
    );

    /* Habilitar botón */

    function updatePublishButton() {

      const valid =
        selectedFile &&
        audioTitle.value.trim().length > 0;

      publishButton.disabled = !valid;
    }

    /* Tamaño */

    function formatFileSize(bytes) {

      if (bytes < 1024) {
        return bytes + " B";
      }

      if (bytes < 1024 * 1024) {
        return (
          (bytes / 1024).toFixed(1) +
          " KB"
        );
      }

      return (
        (bytes / (1024 * 1024)).toFixed(2) +
        " MB"
      );
    }

    /* Estado */

    function showStatus(message, type) {

      status.textContent = message;

      status.className =
        "status show " + type;
    }

    function hideStatus() {

      status.textContent = "";

      status.className =
        "status";
    }

    /* Publicar */

    publishButton.addEventListener(
      "click",
      () => {

        /*
         * TODAVÍA NO PUBLICAMOS.
         *
         * En el siguiente paso conectaremos
         * este botón con el almacenamiento real.
         */

        showStatus(
          "El audio está listo para publicar. La conexión de publicación la agregaremos en el siguiente paso.",
          "success"
        );

      }
    );

  </script>

</body>
</html>
